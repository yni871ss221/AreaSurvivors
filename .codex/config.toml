[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 1800
interrupt_message = true

[agents.explorer]
description = "AreaSurvivorsのコード調査、ログ解析、影響範囲確認を行う読み取り専用エージェント"
config_file = "agents/explorer.toml"

[agents.gameplay_implementer]
description = "Leadが指定したC#ゲーム処理だけを実装するエージェント"
config_file = "agents/gameplay-implementer.toml"

[agents.unity_ui_owner]
description = "指定されたScene、Prefab、HUD、静的UIを排他的に担当するUnity UIエージェント"
config_file = "agents/unity-ui-owner.toml"

[agents.verifier]
description = "差分レビュー、コンパイル、テスト、ログ、回帰リスクを確認する検証エージェント"
config_file = "agents/verifier.toml"
